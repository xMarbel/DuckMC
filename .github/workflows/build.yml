
name: Build DuckMC

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Zbuduj plugin
        run: mvn -B clean package

      - name: Udostępnij JAR
        uses: actions/upload-artifact@v4
        with:
          name: DuckMC-plugin
          path: target/*.jar
